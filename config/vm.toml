# audiobridge-vm — runs inside the Windows guest.
#
# The audio format is not set here. The host side proposes it during the
# handshake and this side follows, so the two can never disagree.

# Interface and port to listen on. 0.0.0.0 accepts the host over any NIC.
listen = "0.0.0.0:17420"

# Must match [server].token on the host.
token = "5489849966250daab413fca7bb1faea1d4e21f5d0352434afdf5699c31d4a0de539d3e55ab650d7d3d0f5b4cdedd55911403c74f24ea53d19b8cb2c57954a3aa"

# Drop the session if the host goes quiet for this long. The host re-handshakes
# on its own, so this only decides how quickly the audio devices are released.
idle_timeout_ms = 5000

# Audio arriving from the Linux microphone. It is *played* into the render half
# of the VB-CABLE; Windows applications then select "CABLE Output" as their
# microphone.
[mic]
enabled = true
device = "CABLE Input (VB-Audio Virtual Cable)"
# Extra latency this side adds to absorb network jitter. 40 ms is comfortable on
# a virtio link; drop to 20 if you want it tighter and the log stays clean.
buffer_ms = 40

# Audio Windows is playing, sent back to the Linux headphones.
[speaker]
enabled = true
mode = "loopback"

# The guest's emulated ich9 sound card, and its default playback device, so
# this is where applications play.
#
# Named explicitly rather than left empty on purpose: if the cable above ever
# became the default output again, an empty value would loop the Linux
# microphone straight back to the Linux headphones and mix it into what
# applications record. Nothing needs to come out of this card on the Linux
# side — the loopback tap works even though QEMU discards its output.
device = "Speakers (High Definition Audio Device)"

# Alternative to the emulated card: install a second virtual cable (VB-Audio
# Cable A/B), make "CABLE-A Input" the Windows default output, and either
# loopback it or read its capture half directly:
#
# mode = "capture"
# device = "CABLE-A Output (VB-Audio Cable A)"
