# audiobridge-host — runs on the Linux machine that has the headset plugged in.

[server]
# Where audiobridge-vm listens, i.e. the Windows guest on the libvirt network.
address = "192.168.122.240:17420"
# Must match the VM side. Empty disables authentication.
token = "5489849966250daab413fca7bb1faea1d4e21f5d0352434afdf5699c31d4a0de539d3e55ab650d7d3d0f5b4cdedd55911403c74f24ea53d19b8cb2c57954a3aa"
# Resend Hello this often until the VM answers.
handshake_timeout_ms = 1000
# Re-handshake after this long without a packet from the VM.
idle_timeout_ms = 5000

# Real microphone -> the VM's virtual microphone.
[mic]
enabled = true
# The USB headset's mono input. Named explicitly rather than left empty so a
# newly plugged-in device cannot silently steal the default.
device = "alsa_input.usb-C-Media_Electronics_Inc._Cmedia_Audio-00.mono-fallback"
rate = 48000
channels = 1
frame_ms = 10

# The VM's playback -> real headphones.
[speaker]
enabled = true
# The USB headset's analog output. There are two Cmedia analog-stereo sinks;
# this is the one PipeWire currently defaults to.
device = "alsa_output.usb-C-Media_Electronics_Inc._Cmedia_Audio-00.analog-stereo"
rate = 48000
channels = 2
# 48 kHz stereo at 10 ms is 1920 bytes of payload, which needs one IP fragment
# on a 1500-byte path. Over the virtio link to the guest that is free.
frame_ms = 10
# Latency this side adds to absorb jitter and clock drift. Raise it if the log
# reports underruns.
buffer_ms = 40
