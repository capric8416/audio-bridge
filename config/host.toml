# audiobridge-host — runs on the Linux machine that has the headset plugged in.

[server]
# Where audiobridge-vm listens. For a KVM guest on the default libvirt network
# this is the guest's 192.168.122.x address.
address = "192.168.122.100:17322"
# Must match the VM side. Empty disables authentication.
token = "change-me"
# Resend Hello this often until the VM answers.
handshake_timeout_ms = 1000
# Re-handshake after this long without a packet from the VM.
idle_timeout_ms = 5000

# Real microphone -> the VM's virtual microphone.
[mic]
enabled = true
# PulseAudio/PipeWire source name; run `audiobridge-host --list-devices`.
# Empty follows the system default source.
device = ""
rate = 48000
channels = 1
frame_ms = 10

# The VM's playback -> real headphones.
[speaker]
enabled = true
# Sink name; empty follows the system default sink.
device = ""
rate = 48000
channels = 2
# 48 kHz stereo at 10 ms is 1920 bytes of payload, which needs one IP fragment
# on a 1500-byte path. Over a virtio link that is free; over Wi-Fi use 5.
frame_ms = 10
# Latency this side adds to absorb jitter and clock drift. Raise it if the log
# reports underruns.
buffer_ms = 40
