[workspace]
resolver = "2"
members = ["crates/proto", "crates/host", "crates/vm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = ""

[workspace.dependencies]
audiobridge-proto = { path = "crates/proto" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
