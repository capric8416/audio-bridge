[package]
name = "audiobridge-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux side of the audio bridge: real headset in, real headset out, PCM over UDP"

[[bin]]
name = "audiobridge-host"
path = "src/main.rs"

[dependencies]
