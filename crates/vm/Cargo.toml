[package]
name = "audiobridge-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows side of the audio bridge: feeds a virtual microphone and captures playback"

[[bin]]
name = "audiobridge-vm"
path = "src/main.rs"

[dependencies]
audiobridge-proto = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

bytemuck = "1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
